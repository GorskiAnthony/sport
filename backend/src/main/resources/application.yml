spring:
  application:
    name: TournoiCenter
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tournoi_center}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      # Spring Boot's default (10) is a hard bottleneck under real concurrent load — every
      # request needs a DB round-trip, so the pool caps throughput long before the JVM or
      # network would. 20 is a reasonable starting point for a single small-to-medium VPS
      # (well under Postgres's default max_connections=100); tune via env var after load
      # testing rather than guessing further.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    # Short-lived "micro-cache" for hot public read endpoints (tournament list/detail) — long
    # enough to collapse a burst of simultaneous identical requests (e.g. many spectators
    # refreshing the same live tournament at once) into a single DB hit, short enough that
    # nobody perceives stale data. A distributed cache (Redis) would only be needed if this
    # ran as more than one instance.
    caffeine:
      spec: expireAfterWrite=${CACHE_TTL_SECONDS:3}s,maximumSize=1000

server:
  port: ${PORT:3000}
  tomcat:
    # Defaults (200 threads / 100 queued) are conservative for a single, purposely-beefed-up
    # instance; the real ceiling is the DB pool size above, so extra headroom here just lets
    # bursts queue gracefully instead of being refused outright. Tune further only after load
    # testing — see deploy.md.
    threads:
      max: ${TOMCAT_MAX_THREADS:400}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origin: ${CLIENT_URL:http://localhost:4200}
    # CORS/WebSocket allowlist only (never used to build links) — covers the Ionic dev server
    # and the Capacitor iOS/Android WebView origins so the mobile app can reach the API in dev.
    additional-origins: ${CORS_ADDITIONAL_ORIGINS:http://localhost:8100,capacitor://localhost,http://localhost}
  jwt:
    # No fallback default on purpose — a missing JWT_SECRET must fail the app at startup, not
    # silently boot with a secret that's public in this repo's history.
    secret: ${JWT_SECRET}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-classic: ${STRIPE_PRICE_CLASSIC:}
    price-pro: ${STRIPE_PRICE_PRO:}
    price-classic-annual: ${STRIPE_PRICE_CLASSIC_ANNUAL:}
    price-pro-annual: ${STRIPE_PRICE_PRO_ANNUAL:}
    price-event-pass: ${STRIPE_PRICE_EVENT_PASS:}
  emailjs:
    service-id: ${EMAILJS_SERVICE_ID:}
    template-id: ${EMAILJS_TEMPLATE_ID:}
    public-key: ${EMAILJS_PUBLIC_KEY:}
    private-key: ${EMAILJS_PRIVATE_KEY:}

logging:
  level:
    com.tournoicenter: INFO

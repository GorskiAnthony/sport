spring:
  application:
    name: TournoiCenter
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tournoi_center}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:3000}

app:
  cors:
    allowed-origin: ${CLIENT_URL:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-classic: ${STRIPE_PRICE_CLASSIC:}
    price-pro: ${STRIPE_PRICE_PRO:}

logging:
  level:
    com.tournoicenter: INFO

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Matchday</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Filet de sécurité : pages qui n'appellent pas setPageMeta (auth, espace connecté...).
       Pas d'og:url/og:image ici — fichier statique commun à tous les domaines possibles
       (voir deploy.md), setPageMeta les fournit en absolu quand le contexte le permet. -->
  <meta name="description" content="Créez, gérez et suivez vos tournois sportifs en temps réel, quel que soit votre sport.">
  <meta property="og:site_name" content="Matchday">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Matchday">
  <meta property="og:description" content="Créez, gérez et suivez vos tournois sportifs en temps réel, quel que soit votre sport.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Matchday">
  <meta name="twitter:description" content="Créez, gérez et suivez vos tournois sportifs en temps réel, quel que soit votre sport.">
  <!-- Umami (analytics auto-hébergé, voir deploy.md) : servi en same-origin sous /stats/ (proxy
       nginx vers le conteneur "umami"), pas de cookie, pas de bannière de consentement nécessaire.
       Même website-id sur tous les environnements (dev/staging/prod partagent la même image, voir
       la contrainte multi-domaine documentée dans deploy.md) — Umami distingue les environnements
       via le hostname de chaque événement, visible dans son rapport "Hostname". -->
  <script defer src="/stats/script.js" data-website-id="392767dd-e2cc-41e4-8f95-b877b814ee66"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

<div class="flex flex-col gap-1.5">
  <label [for]="id()" class="text-slate-300 text-sm font-medium">
    {{ label() }}
    @if (required()) {
      <span class="text-red-400 ml-0.5">*</span>
    }
  </label>
  <select
    [id]="id()"
    (change)="onChange($event)"
    [required]="required()"
    [attr.aria-invalid]="error() ? true : null"
    [attr.aria-describedby]="error() ? id() + '-error' : null"
    class="w-full bg-[#0D1117] border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-green-500 appearance-none"
  >
    <option value="" disabled [selected]="!value()">{{ placeholder() }}</option>
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
    }
  </select>
  @if (error()) {
    <p [id]="id() + '-error'" role="alert" class="text-red-400 text-xs">{{ error() }}</p>
  }
</div>

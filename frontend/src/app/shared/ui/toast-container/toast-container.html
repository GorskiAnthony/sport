<div aria-label="Notifications" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none">
  @for (toast of toasts(); track toast.id) {
    <div
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      class="pointer-events-auto relative flex items-start gap-3 w-80 bg-[#161B22] border rounded-xl px-4 py-3.5 shadow-2xl overflow-hidden"
      [class]="border(toast.type)"
      style="animation: toast-in 0.35s ease"
    >
      <span class="flex-shrink-0 mt-0.5" [class]="iconColor(toast.type)">
        @switch (toast.type) {
          @case ('success') {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          }
          @case ('error') {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10" /><line x1="15" y1="9" x2="9" y2="15" /><line x1="9" y1="9" x2="15" y2="15" />
            </svg>
          }
          @case ('warning') {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
              <line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
          }
          @default {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
          }
        }
      </span>

      <div class="flex-1 min-w-0">
        @if (toast.title) {
          <p class="text-white text-sm font-semibold leading-tight">{{ toast.title }}</p>
        }
        <p class="text-slate-400 text-xs leading-relaxed" [class.mt-0.5]="toast.title">{{ toast.message }}</p>
      </div>

      <button
        (click)="dismiss(toast.id)"
        aria-label="Fermer la notification"
        class="flex-shrink-0 text-slate-500 hover:text-white transition-colors focus-visible:outline-none"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
  }
</div>

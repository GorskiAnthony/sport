@switch (state()) {
  @case ('loading') {
    <div class="w-full h-52 rounded-xl bg-[#161B22] border border-white/10 animate-pulse"></div>
  }
  @case ('ready') {
    <div class="relative">
      <div #mapEl class="w-full h-52 rounded-xl overflow-hidden border border-white/10" aria-label="Carte de localisation du tournoi"></div>
      @if (!precise()) {
        <span class="absolute top-2 right-2 z-[500] text-[10px] font-semibold uppercase tracking-wide px-2 py-1 rounded-full bg-[#0D1117]/90 text-slate-300 border border-white/10">
          Position approximative
        </span>
      }
    </div>
  }
}

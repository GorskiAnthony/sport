<div class="w-full">
  <div class="flex items-center gap-4 mb-3 text-xs">
    <span class="flex items-center gap-1.5 text-slate-300">
      <span class="w-2.5 h-2.5 rounded-full" style="background:#3987e5"></span>
      Nouveaux clients
    </span>
    <span class="flex items-center gap-1.5 text-slate-300">
      <span class="w-2.5 h-2.5 rounded-full" style="background:#199e70"></span>
      Tournois créés
    </span>
  </div>

  <svg
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    class="w-full h-auto"
    role="img"
    [attr.aria-label]="'Évolution des nouveaux clients et tournois créés sur les ' + days() + ' derniers jours'"
    (mousemove)="onMouseMove($event)"
    (mouseleave)="onMouseLeave()"
  >
    @for (tick of yTicks(); track tick.y) {
      <line [attr.x1]="padding.left" [attr.x2]="width - padding.right" [attr.y1]="tick.y" [attr.y2]="tick.y" stroke="#2c2c2a" stroke-width="1" />
      <text [attr.x]="padding.left - 6" [attr.y]="tick.y + 3" text-anchor="end" font-size="9" fill="#898781">{{ tick.label }}</text>
    }

    @for (tick of xTicks(); track tick.label) {
      <text [attr.x]="tick.x" [attr.y]="height - 8" text-anchor="middle" font-size="9" fill="#898781">{{ tick.label }}</text>
    }

    <path [attr.d]="signupsPath()" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path [attr.d]="tournamentsPath()" fill="none" stroke="#199e70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    @if (hovered(); as h) {
      <line [attr.x1]="h.x" [attr.x2]="h.x" [attr.y1]="padding.top" [attr.y2]="height - padding.bottom" stroke="#383835" stroke-width="1" stroke-dasharray="3 3" />
      <circle [attr.cx]="h.x" [attr.cy]="h.ySignups" r="4" fill="#3987e5" stroke="#161B22" stroke-width="2" />
      <circle [attr.cx]="h.x" [attr.cy]="h.yTournaments" r="4" fill="#199e70" stroke="#161B22" stroke-width="2" />
    }
  </svg>

  @if (hovered(); as h) {
    <div class="mt-2 flex items-center gap-4 text-xs text-slate-400 bg-white/5 rounded-lg px-3 py-2 w-fit">
      <span class="text-white font-medium">{{ formatShortDate(h.date) }}</span>
      <span style="color:#3987e5">{{ h.signups }} client(s)</span>
      <span style="color:#199e70">{{ h.tournaments }} tournoi(s)</span>
    </div>
  }
</div>

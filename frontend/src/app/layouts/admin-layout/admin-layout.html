<div class="flex h-screen bg-[#0D1117] text-white overflow-hidden">
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm lg:hidden" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <div
    class="fixed inset-y-0 left-0 z-50 transform transition-transform duration-200 ease-in-out lg:relative lg:translate-x-0 lg:z-auto"
    [class.translate-x-0]="sidebarOpen()"
    [class.-translate-x-full]="!sidebarOpen()"
  >
    <aside class="w-56 lg:w-44 h-full bg-[#0D1117] border-r border-white/10 flex flex-col" aria-label="Navigation d'administration">
      <div class="px-4 py-4 border-b border-white/10 flex items-center justify-between">
        <a routerLink="/" aria-label="Tournoi Center — retour au site">
          <img src="/logo_white.png" alt="Tournoi Center" class="h-8 w-auto" />
        </a>
        <button (click)="closeSidebar()" class="lg:hidden w-7 h-7 flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/5 rounded-lg transition-colors" aria-label="Fermer la navigation">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <div class="px-4 py-2 border-b border-white/10">
        <span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-md bg-amber-500/15 text-amber-400 text-[11px] font-medium">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2l3 6.5 7 .9-5 4.9 1.3 7-6.3-3.4-6.3 3.4 1.3-7-5-4.9 7-.9z" />
          </svg>
          Admin
        </span>
      </div>

      <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto" aria-label="Menu principal">
        @for (item of nav; track item.path) {
          <a
            [routerLink]="item.path"
            [routerLinkActiveOptions]="{ exact: item.end }"
            routerLinkActive="bg-green-500/20 text-green-400 font-medium"
            (click)="closeSidebar()"
            [attr.aria-label]="item.label"
            class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-colors duration-150"
          >
            @switch (item.icon) {
              @case ('overview') {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" />
                  <rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" />
                </svg>
              }
              @case ('clients') {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" />
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
              }
              @case ('tournament') {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="8" r="6" /><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11" />
                </svg>
              }
              @case ('locations') {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" />
                </svg>
              }
            }
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>

      <div class="px-3 pb-4 border-t border-white/10 pt-4">
        <button (click)="logout()" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-colors w-full" aria-label="Se déconnecter">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Déconnexion
        </button>
      </div>
    </aside>
  </div>

  <div class="flex-1 flex flex-col overflow-hidden min-w-0">
    <header class="h-12 flex-shrink-0 bg-[#0D1117] border-b border-white/10 flex items-center justify-between px-3 lg:px-6">
      <button (click)="openSidebar()" class="lg:hidden flex-shrink-0 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/5 rounded-lg transition-colors" aria-label="Ouvrir le menu de navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      @if (user(); as currentUser) {
        <div class="w-8 h-8 rounded-full bg-green-500/20 border border-green-500/30 flex items-center justify-center text-green-400 text-xs font-bold" [attr.aria-label]="'Connecté en tant que ' + currentUser.name">
          {{ initials() }}
        </div>
      }
    </header>
    <main id="admin-content" class="flex-1 overflow-y-auto p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>

  <app-toast-container />
</div>

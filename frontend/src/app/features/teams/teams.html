<div class="flex-1 max-w-7xl mx-auto px-6 py-12">
  <app-page-header badge="Équipes" title="Toutes les" highlight="équipes." subtitle="Toutes les équipes inscrites, tous tournois confondus." />
  <ul class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" role="list">
    @for (team of teams; track team.id) {
      <li class="bg-[#161B22] border border-white/10 rounded-xl p-5 flex items-center gap-4 hover:border-green-500/20 transition-colors">
        <div class="w-12 h-12 rounded-xl bg-green-500/10 border border-green-500/20 flex items-center justify-center text-green-400 text-sm font-bold flex-shrink-0">
          {{ team.initials }}
        </div>
        <div>
          <p class="text-white font-semibold">{{ team.name }}</p>
          <p class="text-slate-400 text-xs">{{ team.city }} · {{ team.category }} · {{ team.sport }}</p>
        </div>
      </li>
    }
  </ul>
</div>

<div class="flex-1 max-w-7xl mx-auto px-6 py-12">
  <app-page-header badge="Sports" title="Explorez par" highlight="sport." subtitle="Trouvez des tournois dans votre discipline préférée." />
  <ul class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5" role="list">
    @for (sport of sports; track sport.id) {
      <li>
        <button type="button" class="w-full bg-[#161B22] border border-white/5 rounded-xl p-6 text-center hover:border-green-500/30 transition-colors group">
          <span class="text-4xl mb-3 block" aria-hidden="true">{{ sport.icon }}</span>
          <p class="text-white font-semibold group-hover:text-green-400 transition-colors">{{ sport.label }}</p>
          <p class="text-slate-500 text-xs mt-1">{{ sport.count }} tournois</p>
        </button>
      </li>
    }
  </ul>
</div>

<app-auth-card title="Réinitialiser le mot de passe" subtitle="Choisissez un nouveau mot de passe.">
  @if (invalidToken()) {
    <p class="text-slate-300 text-sm text-center py-4">
      Ce lien est invalide ou a expiré.
    </p>
    <p class="text-slate-400 text-sm text-center mt-2">
      <a routerLink="/forgot-password" class="text-green-400 hover:text-green-300 transition-colors font-medium focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-500 rounded">
        Demander un nouveau lien
      </a>
    </p>
  } @else {
    <form (submit)="$event.preventDefault(); submit()" aria-label="Formulaire de réinitialisation du mot de passe">
      <div class="space-y-4">
        <app-password-input
          id="reset-password"
          label="Nouveau mot de passe"
          [(value)]="password"
          autoComplete="new-password"
          [required]="true"
          [error]="errors().password"
        />
        <app-password-input
          id="reset-password-confirm"
          label="Confirmer le mot de passe"
          [(value)]="confirmPassword"
          autoComplete="new-password"
          [required]="true"
          [error]="errors().confirmPassword"
        />
      </div>

      <app-button
        [text]="loading() ? 'Mise à jour…' : 'Réinitialiser le mot de passe'"
        variant="primary"
        type="submit"
        [disabled]="loading()"
        className="w-full mt-6 justify-center py-3"
      />
    </form>
  }
</app-auth-card>

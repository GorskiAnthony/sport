<app-auth-card title="Mot de passe oublié" subtitle="Indiquez votre email, nous vous enverrons un lien de réinitialisation.">
  @if (sent()) {
    <p class="text-slate-300 text-sm text-center py-4">
      Si un compte existe pour cet email, un lien de réinitialisation vient d'être envoyé.
    </p>
    <p class="text-slate-400 text-sm text-center mt-2">
      <a routerLink="/login" class="text-green-400 hover:text-green-300 transition-colors font-medium focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-500 rounded">
        Retour à la connexion
      </a>
    </p>
  } @else {
    <form (submit)="$event.preventDefault(); submit()" aria-label="Formulaire de mot de passe oublié">
      <app-form-input
        id="forgot-email"
        label="Email"
        type="email"
        placeholder="votre@email.com"
        [(value)]="email"
        autoComplete="email"
        [required]="true"
        [error]="errors().email"
      />

      <app-button
        [text]="loading() ? 'Envoi…' : 'Envoyer le lien'"
        variant="primary"
        type="submit"
        [disabled]="loading()"
        className="w-full mt-6 justify-center py-3"
      />

      <p class="text-slate-400 text-sm text-center mt-4">
        <a routerLink="/login" class="text-green-400 hover:text-green-300 transition-colors font-medium focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-500 rounded">
          Retour à la connexion
        </a>
      </p>
    </form>
  }
</app-auth-card>

<div class="flex-1 max-w-7xl mx-auto px-6 py-12">
  <app-page-header
    badge="Pour les organisateurs"
    title="Tout ce dont vous"
    highlight="avez besoin."
    subtitle="Organiser un tournoi n'a jamais été aussi simple. Commencez en 4 étapes."
  />

  <ol class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-16">
    @for (step of steps; track step.n) {
      <li class="bg-[#161B22] border border-white/5 rounded-xl p-6 relative">
        <span class="text-green-400 text-5xl font-extrabold opacity-20 absolute top-4 right-4" aria-hidden="true">
          {{ step.n }}
        </span>
        <div class="w-8 h-8 rounded-full bg-green-500/20 border border-green-500/30 flex items-center justify-center text-green-400 text-sm font-bold mb-4">
          {{ step.n }}
        </div>
        <h3 class="text-white font-semibold mb-2">{{ step.title }}</h3>
        <p class="text-slate-400 text-sm">{{ step.desc }}</p>
      </li>
    }
  </ol>

  <div class="text-center">
    <app-button text="Devenir organisateur" variant="primary" routerLink="/register" className="px-8 py-3 text-base" />
    <p class="text-slate-500 text-sm mt-3">Gratuit, sans carte bancaire.</p>
  </div>
</div>

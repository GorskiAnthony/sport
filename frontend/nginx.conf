# Only sets "Connection: upgrade" when the request is actually a WebSocket handshake
# (has an Upgrade header) — plain HTTP requests get "Connection: close" as before,
# so /api/ws (live spectator updates) works without altering normal REST traffic.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# $host ne contient jamais le port (toujours juste le nom d'hôte) ; $http_host reprend le Host
# tel qu'envoyé par le client, port compris s'il n'est pas standard (ex. dev local :4200). Le SSR
# Angular construit document.location à partir du Host reçu — avec $host, og:url/canonical
# perdaient silencieusement le port en dev, sans que ça se voie en prod (443/80 sont implicites).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx doesn't merge add_header across scopes — a location block that sets its own add_header
    # (like the static-assets one below, for Cache-Control) drops any inherited from this server
    # block entirely, so $csp_header exists to avoid repeating this long line, but every add_header
    # below is still repeated explicitly in that location.
    set $csp_header "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; font-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp_header always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reverse-proxied to the backend container over the internal Docker network —
    # keeps the browser calls same-origin (no CORS) and avoids baking the backend's
    # public URL into the frontend build.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le protocole sitemap n'autorise que des <loc> sous le répertoire du fichier sitemap lui-même
    # (ici la racine du site) — d'où l'exposition en /sitemap.xml plutôt que sous /api/**.
    location = /sitemap.xml {
        proxy_pass http://backend:3000/api/sitemap.xml;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # outputMode "server" ne génère plus de index.html statique à la racine du build (seuls les
    # répertoires des routes prérendues — about/, pricing/... — existent en tant que fichiers).
    # Toute page (dynamique comme /, /tournaments, /t/:id, ou CSR pure comme /login,
    # /dashboard/**...) est donc rendue à la demande par le serveur Node Angular SSR du même
    # conteneur (voir app.routes.server.ts pour le mode de rendu par route), sauf si un fichier ou
    # un répertoire prérendu correspond déjà sur disque — servi directement, sans aller-retour Node.
    location / {
        try_files $uri $uri/index.html @ssr;
    }

    location @ssr {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp_header always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

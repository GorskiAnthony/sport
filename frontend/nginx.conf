# Only sets "Connection: upgrade" when the request is actually a WebSocket handshake
# (has an Upgrade header) — plain HTTP requests get "Connection: close" as before,
# so /api/ws (live spectator updates) works without altering normal REST traffic.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# The Angular app is a client-rendered SPA — link-preview crawlers (which don't run JS)
# only ever see this file's static <head>. This flags known social/chat crawler UAs so
# /t/:id can hand them a server-rendered Open Graph card instead (see location below).
map $http_user_agent $is_share_bot {
    default 0;
    "~*facebookexternalhit|Facebot|Twitterbot|Slackbot|WhatsApp|TelegramBot|Discordbot|LinkedInBot|Pinterest|SkypeUriPreview|vkShare|redditbot|Googlebot" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx doesn't merge add_header across scopes — a location block that sets its own add_header
    # (like the static-assets one below, for Cache-Control) drops any inherited from this server
    # block entirely, so $csp_header exists to avoid repeating this long line, but every add_header
    # below is still repeated explicitly in that location.
    set $csp_header "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; font-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp_header always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reverse-proxied to the backend container over the internal Docker network —
    # keeps the browser calls same-origin (no CORS) and avoids baking the backend's
    # public URL into the frontend build.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public tournament share links (/t/:id-slug). Real browsers always get the SPA;
    # only recognized crawler UAs are handed the server-rendered share card so their
    # link previews show the tournament's name/sport/dates instead of generic tags.
    location ~ ^/t/(?<share_tournament_id>\d+) {
        if ($is_share_bot) {
            proxy_pass http://backend:3000/api/share/tournaments/$share_tournament_id;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp_header always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

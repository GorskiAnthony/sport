# Only sets "Connection: upgrade" when the request is actually a WebSocket handshake
# (has an Upgrade header) — plain HTTP requests get "Connection: close" as before,
# so /api/ws (live spectator updates) works without altering normal REST traffic.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# $host ne contient jamais le port (toujours juste le nom d'hôte) ; $http_host reprend le Host
# tel qu'envoyé par le client, port compris s'il n'est pas standard (ex. dev local :4200). Le SSR
# Angular construit document.location à partir du Host reçu — avec $host, og:url/canonical
# perdaient silencieusement le port en dev, sans que ça se voie en prod (443/80 sont implicites).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le résolveur DNS interne de Docker : sans ça, nginx résout "backend" une seule fois au
    # démarrage et garde l'IP en cache indéfiniment. Comme docker-compose up recrée le conteneur
    # backend à chaque déploiement de son image (nouvelle IP), et que frontend/mobile ne
    # redémarrent PAS forcément en même temps (image/config inchangée), leur nginx continuait de
    # taper sur l'ancienne IP du backend après coup — 502 permanent jusqu'au prochain restart de
    # CE conteneur-ci. La variable $backend_upstream (au lieu d'un proxy_pass en dur) force une
    # résolution à chaque requête (dans la limite du TTL ci-dessous).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Le logo sponsor est envoyé en JSON (data URL base64, voir edit-tournament.ts), pas en
    # multipart — une photo de quelques Mo gonflée de ~33% par le base64 dépasse largement la
    # limite nginx par défaut (1m), rejetée avant même d'atteindre le backend.
    client_max_body_size 10m;

    # nginx doesn't merge add_header across scopes — a location block that sets its own add_header
    # (like the static-assets one below, for Cache-Control) drops any inherited from this server
    # block entirely, so $csp_header exists to avoid repeating this long line, but every add_header
    # below is still repeated explicitly in that location.
    set $csp_header "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; font-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp_header always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reverse-proxied to the backend container over the internal Docker network —
    # keeps the browser calls same-origin (no CORS) and avoids baking the backend's
    # public URL into the frontend build.
    location /api/ {
        set $backend_upstream backend:3000;
        # $request_uri (pas juste "/api/") : dès que proxy_pass utilise une variable, nginx arrête
        # de réécrire l'URI selon le préfixe de la location et envoie littéralement ce qui suit la
        # variable — sans $request_uri, TOUTE requête ici (peu importe le sous-chemin) atteignait
        # le backend en tant que simple "/api/", cassant tous les endpoints (404/comportement
        # inattendu selon la route). Voir https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass.
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le protocole sitemap n'autorise que des <loc> sous le répertoire du fichier sitemap lui-même
    # (ici la racine du site) — d'où l'exposition en /sitemap.xml plutôt que sous /api/**.
    location = /sitemap.xml {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream/api/sitemap.xml;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt (ligne "Sitemap:") et llms.txt (liens de pages) ont besoin du domaine absolu, connu
    # seulement à l'exécution (voir CorsProperties) — générés côté backend comme le sitemap ci-dessus,
    # plutôt qu'en fichier statique qui devrait être identique pour tous les domaines possibles.
    location = /robots.txt {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream/api/robots.txt;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream/api/llms.txt;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Umami (analytics auto-hébergé, conteneur "umami" sur le même réseau Docker que ce service,
    # voir deploy.md) : servi en same-origin sous /stats/ pour éviter CORS et rester discret côté
    # bloqueurs de pub. Location en regex (plutôt qu'un préfixe simple) pour retirer "/stats/" tout
    # en gardant $umami_upstream en variable — sans variable, proxy_pass réutiliserait l'IP résolue
    # une seule fois au démarrage (même piège que $backend_upstream ci-dessus) ; mais dès qu'une
    # variable est utilisée, nginx cesse de réécrire automatiquement l'URI selon le préfixe de la
    # location, d'où la capture manuelle du chemin restant dans $1.
    # Pas de $csp_header ici, volontairement : Umami envoie déjà sa propre CSP (nécessaire à son
    # propre dashboard Next.js — 'unsafe-eval'/'unsafe-inline'). add_header ADDITIONNE au lieu de
    # remplacer une réponse proxifiée, donc reprendre $csp_header aurait produit deux en-têtes
    # Content-Security-Policy sur /stats/ ; les navigateurs cumulent alors les deux de façon
    # restrictive (intersection), ce qui casse le JS du dashboard. On garde les autres protections
    # (dès qu'une location définit son propre add_header, elle cesse d'hériter de celles du server
    # block — voir le commentaire plus haut sur $csp_header — d'où leur répétition ici).
    location ~ ^/stats/(.*)$ {
        set $umami_upstream umami:3000;
        proxy_pass http://$umami_upstream/$1$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # outputMode "server" ne génère plus de index.html statique à la racine du build (seuls les
    # répertoires des routes prérendues — about/, pricing/... — existent en tant que fichiers).
    # Toute page (dynamique comme /, /tournaments, /t/:id, ou CSR pure comme /login,
    # /dashboard/**...) est donc rendue à la demande par le serveur Node Angular SSR du même
    # conteneur (voir app.routes.server.ts pour le mode de rendu par route), sauf si un fichier ou
    # un répertoire prérendu correspond déjà sur disque — servi directement, sans aller-retour Node.
    location / {
        try_files $uri $uri/index.html @ssr;
    }

    location @ssr {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp_header always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

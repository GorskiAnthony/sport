# Only sets "Connection: upgrade" when the request is actually a WebSocket handshake
# (has an Upgrade header) — plain HTTP requests get "Connection: close" as before,
# so /api/ws (score en direct) works without altering normal REST traffic.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le résolveur DNS interne de Docker : sans ça, nginx résout "backend" une seule fois au
    # démarrage et garde l'IP en cache indéfiniment — cassé dès que le conteneur backend redémarre
    # (nouvelle IP) sans que celui-ci ne redémarre en même temps (voir frontend/nginx.conf, même
    # fix). $backend_upstream force une résolution à chaque requête (dans la limite du TTL).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Pas de Content-Security-Policy stricte ici (contrairement à frontend/nginx.conf) : le
    # scanner QR (@capacitor-mlkit/barcode-scanning, implémentation web) a besoin de getUserMedia
    # et potentiellement de workers/wasm dont les sources exactes ne sont pas figées — à muscler
    # une fois le comportement web du scanner validé en conditions réelles.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reverse-proxied to the backend container over the internal Docker network — garde les
    # appels du navigateur same-origin (pas de CORS) et évite de baker l'URL publique du
    # backend dans le build (voir frontend/nginx.conf, même logique).
    location /api/ {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA pure (pas de SSR côté mobile) : toute route inconnue du disque (/join/:token,
    # /login, /tournaments/:id...) retombe sur index.html, le router Angular prend le relai.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

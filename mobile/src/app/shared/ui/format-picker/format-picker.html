<ion-radio-group [value]="value()" (ionChange)="onChange($any($event.detail).value)">
  @for (option of options; track option.id) {
    <ion-item fill="outline" lines="none" class="format-item">
      <ion-radio [value]="option.id" justify="start" labelPlacement="end">
        <ion-label>
          <h3>{{ option.title }}</h3>
          <ion-text color="medium">
            <p>{{ option.description }}</p>
          </ion-text>
        </ion-label>
      </ion-radio>
    </ion-item>
  }
</ion-radio-group>

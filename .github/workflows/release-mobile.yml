name: Release mobile

on:
  push:
    branches: [dev, main]
    paths:
      - 'mobile/**'
  workflow_dispatch: {}

concurrency:
  # Shared with release-frontend.yml/release-backend.yml: all three write version-bump commits
  # and tags back to the same branch via @semantic-release/git, so they must not race.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Explicit branch ref (not the default github.sha) so a job that was queued behind
          # release-backend.yml/release-frontend.yml picks up their version-bump commit instead
          # of checking out the stale commit that originally triggered this run.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify mobile builds and tests pass
        working-directory: mobile
        run: |
          npm ci
          npx ng build --configuration production,docker
          npx ng test

      - name: Install release tooling
        if: github.ref_name == 'main'
        run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main: semantic-release computes the next version from commits, updates the
      # changelog/package.json, tags, publishes a GitHub release, and pushes `:latest`.
      - name: Release
        if: github.ref_name == 'main'
        working-directory: mobile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOBILE_IMAGE: ghcr.io/${{ github.repository_owner }}/sport-mobile
        run: |
          export MOBILE_IMAGE=$(echo "$MOBILE_IMAGE" | tr '[:upper:]' '[:lower:]')
          npx semantic-release -e semantic-release-monorepo

      # dev: no versioning/changelog — just refresh the mutable `:dev` tag Dokploy's
      # preprod service tracks (MOBILE_TAG=dev).
      - name: Publish dev image
        if: github.ref_name == 'dev'
        working-directory: mobile
        env:
          MOBILE_IMAGE: ghcr.io/${{ github.repository_owner }}/sport-mobile
        run: |
          export MOBILE_IMAGE=$(echo "$MOBILE_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$MOBILE_IMAGE:dev" .
          docker push "$MOBILE_IMAGE:dev"

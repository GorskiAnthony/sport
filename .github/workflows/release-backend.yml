name: Release backend

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
  workflow_dispatch: {}

concurrency:
  # Shared with release-frontend.yml: both write version-bump commits and tags
  # back to the same branch via @semantic-release/git, so they must not race.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Explicit branch ref (not the default github.sha) so a job that was
          # queued behind release-frontend.yml picks up its version-bump commit
          # instead of checking out the stale commit that originally triggered this run.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        if: github.ref_name == 'main'
        with:
          node-version: '24'
          cache: npm

      - name: Verify backend builds and tests pass
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Install release tooling
        if: github.ref_name == 'main'
        run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main: semantic-release computes the next version from commits, updates the
      # changelog/pom.xml, tags, publishes a GitHub release, and pushes `:latest`.
      - name: Release
        if: github.ref_name == 'main'
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/sport-backend
        run: |
          export BACKEND_IMAGE=$(echo "$BACKEND_IMAGE" | tr '[:upper:]' '[:lower:]')
          npx semantic-release -e semantic-release-monorepo

      # dev: no versioning/changelog — just refresh the mutable `:dev` tag Dokploy's
      # preprod service tracks (BACKEND_TAG=dev).
      - name: Publish dev image
        if: github.ref_name == 'dev'
        working-directory: backend
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/sport-backend
        run: |
          export BACKEND_IMAGE=$(echo "$BACKEND_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$BACKEND_IMAGE:dev" .
          docker push "$BACKEND_IMAGE:dev"
